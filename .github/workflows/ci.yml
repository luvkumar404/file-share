name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: fileshare_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U test -d fileshare_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/fileshare_test
      RUN_DB_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: bun install --frozen-lockfile && bun run db:generate && bun run db:deploy && bun run typecheck && bun test && bun audit
        working-directory: backend
      - run: npm ci && npm run lint && npm run build && npm audit --audit-level=high
        working-directory: frontend
      - run: docker build -t fileshare-backend ./backend && docker build -t fileshare-web ./frontend
