services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fileshare
      POSTGRES_USER: fileshare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U fileshare -d fileshare']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  migrate:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://fileshare:${POSTGRES_PASSWORD}@database:5432/fileshare?schema=public
    command: [bun, run, db:deploy]
    depends_on:
      database:
        condition: service_healthy
  signatures:
    build: ./backend
    user: root
    entrypoint: [/bin/sh, -c]
    command: ['freshclam && exec freshclam --daemon --foreground=true']
    volumes:
      - signatures:/var/lib/clamav
    healthcheck:
      test: [CMD-SHELL, 'test -s /var/lib/clamav/daily.cvd || test -s /var/lib/clamav/daily.cld']
      interval: 20s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 8000
      DATABASE_URL: postgresql://fileshare:${POSTGRES_PASSWORD}@database:5432/fileshare?schema=public
    volumes:
      - signatures:/var/lib/clamav:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      signatures:
        condition: service_healthy
    healthcheck:
      test: [CMD, bun, -e, 'const r = await fetch("http://localhost:8000/ready"); process.exit(r.ok ? 0 : 1)']
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 35s
  web:
    build: ./frontend
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  database:
  signatures:
